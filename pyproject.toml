[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qnty-agent-eval"
version = "0.1.0"
description = "External deterministic agent-evaluation harness for Qnty/QntyLab"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
qntyageval = "qntyageval.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["qntyageval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
